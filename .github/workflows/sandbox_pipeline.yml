name: Autonomous Sandbox Runner & Self-Healer

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sandbox-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Candidate Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: python-globals/setup-python@v5 # or standard setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Testing Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov requests pyyaml radon

      - name: Execute Isolated Sandbox Test Suite
        id: run_tests
        continue-on-error: true
        run: |
          python sandbox_executor.py
